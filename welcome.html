<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BRRMS - Welcome</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, 'Times New Roman', serif;
            background: linear-gradient(135deg, #0b1f3a 0%, #14315c 60%, #1a3f75 100%);
            overflow: hidden;
            position: relative;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            animation: float 8s ease-in-out infinite;
        }
        .glow-1 {
            width: 320px;
            height: 320px;
            background: #ffd76a;
            top: -80px;
            left: -80px;
        }
        .glow-2 {
            width: 260px;
            height: 260px;
            background: #4d7fff;
            bottom: -60px;
            right: -60px;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .card {
            position: relative;
            z-index: 2;
            background: #fff;
            border-radius: 18px;
            padding: 56px 48px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(24px);
            animation: riseIn 0.7s ease forwards;
        }

        @keyframes riseIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 18px;
        }

        .eyebrow {
            letter-spacing: 2px;
            font-size: 12px;
            font-weight: bold;
            color: #1a56db;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin: 12px 0 6px;
            font-size: 30px;
            color: #12203b;
        }

        .role-badge {
            display: inline-block;
            margin-top: 6px;
            margin-bottom: 20px;
            padding: 5px 14px;
            border-radius: 999px;
            background: #eef3ff;
            color: #1a56db;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 600;
        }

        p.subtitle {
            font-family: Arial, sans-serif;
            color: #5b6472;
            font-size: 14.5px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .continue-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #1a56db;
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .continue-btn:hover {
            background: #163fa0;
            transform: translateY(-1px);
        }

        .continue-btn:active {
            transform: translateY(0);
        }

        .fine-print {
            margin-top: 16px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #9aa2af;
        }

        .fine-print a {
            color: #1a56db;
            text-decoration: none;
        }

        .fine-print a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="card">

        <img src="images/logo.png" alt="BRRMS Logo" class="logo">

        <div class="eyebrow">Barangay Resident Records Management System</div>

        <h1 id="welcomeHeading">Welcome!</h1>

        <div class="role-badge" id="roleBadge">Staff</div>

        <p class="subtitle" id="welcomeSubtitle">
            You're securely signed in. Your dashboard has your residents,
            officials, and document requests ready whenever you are.
        </p>

        <button type="button" class="continue-btn" id="continueBtn">
            Continue to Dashboard →
        </button>

        <div class="fine-print">
            Not you? <a href="#" id="notYouLink">Log out</a>
        </div>

    </div>

    <script>

        const user =
            JSON.parse(localStorage.getItem("brrmsUser"));

        // No session at all? Send them to login instead of showing a
        // welcome screen with nothing to personalize.
        if (!user) {

            window.location.href = "login.html";

        } else {

            const firstName =
                (user.full_name || "there").split(" ")[0];

            document.getElementById("welcomeHeading").textContent =
                `Welcome, ${firstName}!`;

            document.getElementById("roleBadge").textContent =
                user.role || "Staff";

            const roleMessages = {
                "Administrator":
                    "You have full administrator access to manage residents, officials, and system records.",
                "Barangay Captain":
                    "As Barangay Captain, you can review records, officials, and document requests for your barangay.",
                "Staff":
                    "You're securely signed in. Your dashboard has your residents, officials, and document requests ready whenever you are."
            };

            document.getElementById("welcomeSubtitle").textContent =
                roleMessages[user.role] || roleMessages["Staff"];

        }

        document
            .getElementById("continueBtn")
            .addEventListener("click", function() {

                window.location.href = "index.html";

            });

        document
            .getElementById("notYouLink")
            .addEventListener("click", function(event) {

                event.preventDefault();

                localStorage.removeItem("brrmsUser");

                window.location.href = "login.html";

            });

    </script>

</body>
</html>
