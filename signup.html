<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BRRMS - Sign Up</title>

    <link rel="stylesheet" href="css/stylee.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <!-- LOGO -->
            <div class="auth-logo">
                <img src="images/logo.png" alt="BRRMS">
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Barangay Resident Records Management System
            </p>

            <h2>Sign Up</h2>

            <form id="signupForm" novalidate>

                <!-- FULL NAME -->
                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Juan Dela Cruz"
                        required
                    >

                    <small
                        class="error-message"
                        id="fullNameError">
                    </small>

                </div>


                <!-- EMAIL ADDRESS -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >

                    <small
                        class="error-message"
                        id="emailError">
                    </small>

                </div>



                </button>


                <!-- USERNAME -->
                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                    <small
                        class="error-message"
                        id="usernameError">
                    </small>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                        minlength="8"
                    >

                    <small
                        class="error-message"
                        id="passwordError">
                    </small>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                        minlength="8"
                    >

                    <small
                        class="error-message"
                        id="confirmPasswordError">
                    </small>

                </div>


                <!-- MFA CODE -->
                <div class="form-group">

                    <label for="mfaCode">
                        MFA Code
                    </label>

                    <input
                        type="text"
                        id="mfaCode"
                        name="mfaCode"
                        placeholder="Enter 6-digit MFA code"
                        maxlength="6"
                        inputmode="numeric"
                    >

                    <small
                        class="error-message"
                        id="mfaCodeError">
                    </small>

                </div>


                <!-- CREATE ACCOUNT BUTTON -->
                <button
                    type="submit"
                    class="auth-btn">
                    Create Account
                </button>


                <!-- SIGNUP MESSAGE -->
                <p
                    id="signupMessage"
                    class="auth-message">
                </p>

            </form>


            <!-- LOGIN LINK -->
            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <!-- SIGNUP JAVASCRIPT -->
    <script src="js/signup.js"></script>

</body>
</html>
